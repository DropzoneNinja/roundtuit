gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/html text/css application/javascript application/json image/svg+xml;
gzip_min_length 256;

# HTTP — redirect all traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — main server block
# Replace the two ssl_certificate* paths with your actual cert paths before deploying.
# Example (Let's Encrypt / certbot):
#   ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate     /etc/ssl/certs/YOUR_DOMAIN_fullchain.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_DOMAIN_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;

    # Vite-hashed assets — immutable, cache forever
    location /assets/ {
        add_header Cache-Control "max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy to backend
    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
